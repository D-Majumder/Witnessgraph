name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src research

      - name: Test (pytest)
        # GitHub Actions sets GITHUB_ACTIONS=true, which Typer's rich_utils
        # detects to force styled/colored CLI error output. Several CLI
        # tests assert on literal option-name substrings in stderr (e.g.
        # `assert b"--value" in result.stderr_bytes`), which the styling
        # splits across ANSI escape codes. `_TYPER_FORCE_DISABLE_TERMINAL`
        # is Typer's documented escape hatch for exactly this.
        run: pytest -q
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build
